name: Docker-Image bauen und veröffentlichen

on:
  push:
    branches: [master]
    # Versions-Tags wie v1.2.3 erzeugen zusätzlich die Tags 1.2.3 und 1.2
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # Bei Pull Requests wird nur gebaut, nicht gepusht - deshalb kein Login.
      - name: An Docker Hub anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image-Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sharpboxai
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          # Cross-Compile im Dockerfile, daher kein QEMU nötig.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
